name: Release

# Release pipeline: the version lives in plugins/zensu/.codex-plugin/plugin.json
# + the README badge + the newest CHANGELOG heading — all bumped together.
# README.md, CHANGELOG.md, and LICENSE are also copied byte-for-byte into the
# distributable plugin root so $zensu-help never depends on repository-parent
# files. These invariants are machine-enforced by the structure tests below.
# The .agents/plugins/marketplace.json descriptor pins the install source to the
# immutable release tag matching the plugin manifest. Tests use an ephemeral
# local marketplace so they validate the exact checkout before that tag exists.
#
# Flow:
#   1. Dispatch this workflow (Actions -> Release) with a version_type.
#   2. The `prepare` job computes the next version, bumps the version files,
#      generates the CHANGELOG section from the commits since the last tag
#      (git-cliff), pushes a `release/vX.Y.Z` branch, and prints a Compare link.
#   3. Open the PR from that link, then review + squash-merge it.
#   4. The `publish-gate` job examines every push to main independently of its
#      commit subject. A manifest version transition with no tag starts
#      publication, the same tag on the current SHA resumes exact-SHA
#      verification idempotently, and every other push skips publication.
#   5. The `publish` job reruns the deterministic CI gate at the
#      exact clean release SHA, records its source runtime digest, then creates
#      the draft, uploads exactly one verified asset, and publishes an
#      immutable GitHub Release. Publication is the go-live point; merging an
#      ordinary feature PR never changes the active install source.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run: compute version + notes only, do not push a branch'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Deterministic test gate
        run: bash tests/run-all.sh --ci

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          LATEST="$(git tag -l 'v*' | sort -V | tail -1)"
          if [[ ! "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"
          CURRENT="$(jq -er '.version' plugins/zensu/.codex-plugin/plugin.json)"
          VER="$(node scripts/next-release-version.js "${{ inputs.version_type }}" "${LATEST#v}" "$CURRENT")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "New version: v$VER"

      - name: Bump version files
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          # Edit only the version line (format-preserving). jq would rewrite the
          # whole file in canonical style and reformat e.g. inline arrays.
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[0-9]+\.[0-9]+\.[0-9]+(")/\1'"$VER"'\2/' plugins/zensu/.codex-plugin/plugin.json
          sed -i -E "s#version-[0-9]+\.[0-9]+\.[0-9]+-#version-${VER}-#" README.md
          node -e '
            const fs = require("node:fs");
            const file = ".agents/plugins/marketplace.json";
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            doc.plugins[0].source.ref = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + "\n");
          ' "${{ steps.ver.outputs.tag }}"
          echo "Bumped plugin.json, README badge, immutable marketplace ref -> $VER"
          # Sanity: the invariant holds (CHANGELOG joins in the next step).
          test "$(jq -r .version plugins/zensu/.codex-plugin/plugin.json)" = "$VER"
          grep -q "version-${VER}-" README.md
          test "$(jq -r '.plugins[0].source.ref' .agents/plugins/marketplace.json)" = "v$VER"

      - name: Generate CHANGELOG section (git-cliff)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.ver.outputs.tag }}
        env:
          OUTPUT: ${{ runner.temp }}/section.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepend section into CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          SECTION="${{ runner.temp }}/section.md"
          test -s "$SECTION" || { echo "::error::git-cliff produced no section (no conventional commits since the last tag?)"; exit 1; }
          # Splice the generated section immediately ABOVE the newest existing
          # version heading (`## [x.y.z]`). CHANGELOG.md carries no `## [Unreleased]`
          # anchor, so anchoring on one silently drops the section (the original bug).
          awk -v secfile="$SECTION" '
            BEGIN { while ((getline line < secfile) > 0) sec = sec line "\n" }
            !spliced && /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { printf "%s\n", sec; spliced = 1 }
            { print }
            END { if (!spliced) printf "\n%s", sec }
          ' CHANGELOG.md > "${{ runner.temp }}/CHANGELOG.new"
          mv "${{ runner.temp }}/CHANGELOG.new" CHANGELOG.md
          # Guard: the bumped CHANGELOG must now carry $VER as its newest heading,
          # else the splice landed nowhere and the release would ship un-noted.
          NEWEST="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"
          test "$NEWEST" = "$VER" || { echo "::error::CHANGELOG newest heading '$NEWEST' != '$VER' — section not spliced"; exit 1; }
          echo "----- generated section -----"
          cat "$SECTION"

      - name: Sync distributable plugin documentation
        run: |
          set -euo pipefail
          cp README.md plugins/zensu/README.md
          cp CHANGELOG.md plugins/zensu/CHANGELOG.md
          cp LICENSE plugins/zensu/LICENSE
          cmp -s README.md plugins/zensu/README.md
          cmp -s CHANGELOG.md plugins/zensu/CHANGELOG.md
          cmp -s LICENSE plugins/zensu/LICENSE

      - name: Verify post-bump release invariants
        run: |
          set -euo pipefail
          bash tests/structure/test-version-sync.sh
          bash tests/structure/test-immutable-marketplace-release.sh

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run — v${{ steps.ver.outputs.version }}"
            echo ""
            echo '```markdown'
            cat "${{ runner.temp }}/section.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release commit
        id: release_commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          BR="release/${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add \
            plugins/zensu/.codex-plugin/plugin.json \
            plugins/zensu/README.md \
            plugins/zensu/CHANGELOG.md \
            plugins/zensu/LICENSE \
            .agents/plugins/marketplace.json \
            README.md \
            CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.version }}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test -n "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify distributable plugin documentation
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          bash tests/structure/test-zensu-help-packaging.sh
          bash tests/structure/test-zensu-help-install-artifact.sh

      - name: Record deterministic exact-commit runtime evidence
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_SHA="${{ steps.release_commit.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          bash tests/run-all.sh --ci
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          RUNTIME_DIGEST="$(
            node plugins/zensu/hooks/lib/session-control-core-v1.js runtime-digest \
              --plugin-root "$GITHUB_WORKSPACE/plugins/zensu" \
              --host codex
          )"
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          VERSION="$(jq -r '.version' plugins/zensu/.codex-plugin/plugin.json)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          EVIDENCE_DIR="$RUNNER_TEMP/deterministic-release-evidence"
          mkdir -p "$EVIDENCE_DIR"
          jq -n \
            --arg source_git_revision "$RELEASE_SHA" \
            --arg runtime_digest "$RUNTIME_DIGEST" \
            --arg plugin_version "$VERSION" \
            '{schema:"zensu-deterministic-release-evidence-v1", gate:"passed", source_git_revision:$source_git_revision, runtime_digest:$runtime_digest, plugin_version:$plugin_version}' \
            > "$EVIDENCE_DIR/release-gate.json"
          echo "ZENSU_RELEASE_EVIDENCE_REVISION=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Upload exact-SHA release evidence
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-release-${{ env.ZENSU_RELEASE_EVIDENCE_REVISION }}
          path: ${{ runner.temp }}/deterministic-release-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Push release branch + print PR link
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-release-push-config
          HOME: ${{ runner.temp }}/gh-release-push-home
        run: |
          set -euo pipefail
          BR="${{ steps.release_commit.outputs.branch }}"
          mkdir -p "$GH_CONFIG_DIR" "$HOME"
          gh auth setup-git
          test "$(git rev-parse HEAD)" = "${{ steps.release_commit.outputs.sha }}"
          test -z "$(git status --porcelain)"
          # Force-push so re-running for the same version overwrites a stale branch.
          git push -f origin "$BR"
          TITLE_ENC="$(printf '%s' 'chore(release): bump version to ${{ steps.ver.outputs.version }}' | jq -sRr @uri)"
          PR_URL="${{ github.server_url }}/${{ github.repository }}/compare/main...${BR}?expand=1&title=${TITLE_ENC}"
          {
            echo "## Release v${{ steps.ver.outputs.version }} — open the PR"
            echo ""
            echo "Branch \`${BR}\` pushed. **Open the release PR:**"
            echo ""
            echo "${PR_URL}"
            echo ""
            echo "Review + **squash-merge** it → the \`publish\` job tags main and publishes the release."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open the PR: ${PR_URL}"

  publish-gate:
    name: Determine whether this push publishes a release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify version tag for this main SHA
        id: release
        run: |
          set -euo pipefail
          SHOULD_PUBLISH="$(bash scripts/classify-release-push.sh "$GITHUB_SHA")"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release
    needs: publish-gate
    if: >-
      github.event_name == 'push' &&
      needs.publish-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Require immutable releases before publish work
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::IMMUTABLE_RELEASES_ADMIN_TOKEN is required"; exit 1; }
          test "$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = true || {
            echo "::error::GitHub Immutable Releases must be enabled before publishing"
            exit 1
          }

      - name: Extract expected release notes
        run: |
          set -euo pipefail
          VER="$(jq -r '.version' plugins/zensu/.codex-plugin/plugin.json)"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { f = 1; next }
            f && /^## \[/ { f = 0 }
            f { print }
          ' CHANGELOG.md > "${{ runner.temp }}/notes.md"
          if [ ! -s "${{ runner.temp }}/notes.md" ]; then
            echo "Release v$VER" > "${{ runner.temp }}/notes.md"
          fi

      - name: Verify immutable marketplace release target
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(jq -r '.version' plugins/zensu/.codex-plugin/plugin.json)"
          TAG="v$VER"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r '.plugins[0].source.source' .agents/plugins/marketplace.json)" = git-subdir
          test "$(jq -r '.plugins[0].source.url' .agents/plugins/marketplace.json)" = https://github.com/MKITConsulting/zensu-codex.git
          test "$(jq -r '.plugins[0].source.path' .agents/plugins/marketplace.json)" = ./plugins/zensu
          test "$(jq -r '.plugins[0].source.ref' .agents/plugins/marketplace.json)" = "$TAG"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ASSET="zensu-codex-v${VER}.zip"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          EXPECTED_BODY="$(cat "${{ runner.temp }}/notes.md")"
          EXPECTED_ASSET="$RUNNER_TEMP/exact-sha-$ASSET"
          git archive --format=zip -o "$EXPECTED_ASSET" "$GITHUB_SHA"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
              echo "::error::$TAG already exists at $TAG_SHA, not exact main SHA ${{ github.sha }}"
              exit 1
            fi
          fi
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG")"
          if [ -z "$RELEASE_JSON" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "release_id=" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.draft' <<<"$RELEASE_JSON")" = true ]; then
            test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
            TARGET="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
            [ "$TARGET" = "$GITHUB_SHA" ] || [ "$(git rev-parse "$TARGET^{commit}" 2>/dev/null || true)" = "$GITHUB_SHA" ] || {
              echo "::error::existing draft targets $TARGET, not $GITHUB_SHA"
              exit 1
            }
            test "$(jq '.assets | length' <<<"$RELEASE_JSON")" -le 1
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "release_id=$(jq -r '.id' <<<"$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          else
            test "$(jq -r '.immutable' <<<"$RELEASE_JSON")" = true || {
              echo "::error::existing published release $TAG is mutable; refusing to trust or replace it"
              exit 1
            }
            test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
            test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
            test "$(jq -r '.name' <<<"$RELEASE_JSON")" = "$TAG" || {
              echo "::error::existing immutable release title does not match $TAG"
              exit 1
            }
            test "$(jq -r '.body' <<<"$RELEASE_JSON")" = "$EXPECTED_BODY" || {
              echo "::error::existing immutable release notes do not match generated notes"
              exit 1
            }
            TARGET="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
            [ "$TARGET" = "$GITHUB_SHA" ] || [ "$(git rev-parse "$TARGET^{commit}" 2>/dev/null || true)" = "$GITHUB_SHA" ] || {
              echo "::error::existing immutable release target $TARGET does not resolve to $GITHUB_SHA"
              exit 1
            }
            test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = 1
            test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$ASSET"
            test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = uploaded
            jq -er '.assets[0].digest | test("^sha256:[a-f0-9]{64}$")' <<<"$RELEASE_JSON" >/dev/null
            EXISTING_DIR="$RUNNER_TEMP/existing-release-asset"
            mkdir -p "$EXISTING_DIR"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$EXISTING_DIR"
            test "sha256:$(sha256sum "$EXISTING_DIR/$ASSET" | awk '{print $1}')" = "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")"
            test "sha256:$(sha256sum "$EXPECTED_ASSET" | awk '{print $1}')" = "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")"
            cmp -s "$EXPECTED_ASSET" "$EXISTING_DIR/$ASSET"
            echo "$TAG is already published immutably at the exact gated main SHA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$(jq -r '.id' <<<"$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify distributable plugin documentation
        run: |
          set -euo pipefail
          bash tests/structure/test-zensu-help-packaging.sh
          bash tests/structure/test-zensu-help-install-artifact.sh

      - name: Deterministic exact-main-SHA gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          bash tests/run-all.sh --ci
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          RUNTIME_DIGEST="$(
            node plugins/zensu/hooks/lib/session-control-core-v1.js runtime-digest \
              --plugin-root "$GITHUB_WORKSPACE/plugins/zensu" \
              --host codex
          )"
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          VERSION="$(jq -r '.version' plugins/zensu/.codex-plugin/plugin.json)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          EVIDENCE_DIR="$RUNNER_TEMP/deterministic-publish-evidence"
          mkdir -p "$EVIDENCE_DIR"
          jq -n \
            --arg source_git_revision "$GITHUB_SHA" \
            --arg runtime_digest "$RUNTIME_DIGEST" \
            --arg plugin_version "$VERSION" \
            '{schema:"zensu-deterministic-release-evidence-v1", gate:"passed", source_git_revision:$source_git_revision, runtime_digest:$runtime_digest, plugin_version:$plugin_version}' \
            > "$EVIDENCE_DIR/release-gate.json"

      - name: Upload exact-SHA publish evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-publish-${{ github.sha }}
          path: ${{ runner.temp }}/deterministic-publish-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Package plugin source
        if: steps.v.outputs.skip == 'false'
        run: git archive --format=zip -o "zensu-codex-v${{ steps.v.outputs.version }}.zip" HEAD

      - name: Create or validate draft and upload the single asset
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          ASSET="${{ steps.v.outputs.asset }}"
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG")"
          if [ -z "$RELEASE_JSON" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file "${{ runner.temp }}/notes.md"
          fi
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG" --required)"
          RELEASE_ID="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$RELEASE_JSON")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = true
          jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --rawfile body "${{ runner.temp }}/notes.md" \
            '{tag_name:$tag,target_commitish:$sha,name:$tag,body:$body,draft:true,prerelease:false}' \
            | gh api -H "X-GitHub-Api-Version: 2026-03-10" --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - >/dev/null
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG" --required)"
          EXPECTED_BODY="$(cat "${{ runner.temp }}/notes.md")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = true
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.body' <<<"$RELEASE_JSON")" = "$EXPECTED_BODY"
          TARGET="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
          [ "$TARGET" = "$GITHUB_SHA" ] || [ "$(git rev-parse "$TARGET^{commit}" 2>/dev/null || true)" = "$GITHUB_SHA" ] || {
            echo "::error::draft target $TARGET does not resolve to $GITHUB_SHA"
            exit 1
          }
          ASSET_COUNT="$(jq '.assets | length' <<<"$RELEASE_JSON")"
          test "$ASSET_COUNT" -le 1
          LOCAL_DIGEST="sha256:$(sha256sum "$ASSET" | awk '{print $1}')"
          if [ "$ASSET_COUNT" = 0 ]; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY"
            RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG" --required --until '(.assets | length) != 0 and .assets[0].state == "uploaded" and ((.assets[0].digest // "") | test("^sha256:[a-f0-9]{64}$"))')"
          fi
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$ASSET"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = uploaded
          test "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")" = "$LOCAL_DIGEST"

      - name: Recheck immutable releases immediately before publish
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::IMMUTABLE_RELEASES_ADMIN_TOKEN is required"; exit 1; }
          test "$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = true || {
            echo "::error::Immutable Releases was disabled during the publish run"
            exit 1
          }

      - name: Revalidate draft metadata and asset immediately before publish
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          ASSET="${{ steps.v.outputs.asset }}"
          EXPECTED_BODY="$(cat "${{ runner.temp }}/notes.md")"
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG" --required)"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = true
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.body' <<<"$RELEASE_JSON")" = "$EXPECTED_BODY"
          TARGET="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
          [ "$TARGET" = "$GITHUB_SHA" ] || [ "$(git rev-parse "$TARGET^{commit}" 2>/dev/null || true)" = "$GITHUB_SHA" ] || {
            echo "::error::draft target $TARGET changed before publication"
            exit 1
          }
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$ASSET"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = uploaded
          LOCAL_DIGEST="sha256:$(sha256sum "$ASSET" | awk '{print $1}')"
          test "$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")" = "$LOCAL_DIGEST"
          PUBLISH_ID="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$RELEASE_JSON")"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" --method PATCH "repos/$GITHUB_REPOSITORY/releases/$PUBLISH_ID" -F draft=false >/dev/null

      - name: Verify immutable release, exact tag SHA, and asset digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          ASSET="${{ steps.v.outputs.asset }}"
          RELEASE_JSON="$(bash scripts/read-release-by-tag.sh "$GITHUB_REPOSITORY" "$TAG" --required --until '.immutable == true and ((.assets[0].digest // "") | test("^sha256:[a-f0-9]{64}$"))')"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.immutable' <<<"$RELEASE_JSON")" = true
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" = 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$ASSET"
          test "$(jq -r '.assets[0].state' <<<"$RELEASE_JSON")" = uploaded
          API_DIGEST="$(jq -r '.assets[0].digest' <<<"$RELEASE_JSON")"
          VERIFY_DIR="$RUNNER_TEMP/verified-release-asset"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$VERIFY_DIR"
          test "sha256:$(sha256sum "$VERIFY_DIR/$ASSET" | awk '{print $1}')" = "$API_DIGEST"
          FINAL_EXPECTED_ASSET="$RUNNER_TEMP/final-exact-sha-$ASSET"
          git archive --format=zip -o "$FINAL_EXPECTED_ASSET" "$GITHUB_SHA"
          test "sha256:$(sha256sum "$FINAL_EXPECTED_ASSET" | awk '{print $1}')" = "$API_DIGEST"
          cmp -s "$FINAL_EXPECTED_ASSET" "$VERIFY_DIR/$ASSET"
          TAG_SHA="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$TAG_SHA" = "$GITHUB_SHA"
