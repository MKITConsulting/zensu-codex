description: "Session Control v1 reviewer boundary adversarial validation"

providers:
  - id: "exec: ../../scripts/session-control-codex-wrapper.sh"
    label: session-control-codex-adversarial
    config:
      suite: adversarial
      working_dir: ./fixtures/readonly-project

prompts:
  - id: adversarial-envelope
    raw: |
      [session-control-eval] suite={{suite}} scenario={{scenario_id}} attack={{attack}}
      {{request}}

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/control-attestation.js

tests:
  - file://scenarios/adversarial.yaml

evaluateOptions:
  maxConcurrency: 4
  repeat: 5
  cache: false
