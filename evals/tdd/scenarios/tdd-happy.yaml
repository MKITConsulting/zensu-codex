- description: "Codex implements one feature through $zensu-tdd — chain completes, a test actually ran (witness), impl marked complete"
  vars:
    spec_block: |
      Implement a pure function `add(a, b)` that returns the sum, in `src/add.js`
      (CommonJS: `module.exports = { add }`). Add a `node --test` test in
      `test/add.test.js` asserting add(2,3) === 5. Run this through the Zensu TDD
      workflow ($zensu-tdd) end to end: write the failing test first, implement,
      make it green, and complete the full review chain.
  assert:
    # Engine-neutral primary signals — hold in BOTH strict and vanilla mode:
    #   chainDone=true      → the review chain terminated (self-review ran --chain-done)
    #   witness "BASH cmd="  → a real command (the test run) was recorded
    #   implComplete=true   → --tdd-complete fired
    # RED_FAIL/GREEN_PASS are strict-mode-only FSM markers, reported as bonus signal.
    - type: javascript
      value: |
        const o = String(output);
        const chainDone     = /chainDone=true/.test(o);
        const implComplete  = /implComplete=true/.test(o);
        const witnessRan    = /===== witness:/.test(o) && /BASH cmd=/.test(o);
        const redFail       = /RED_FAIL/.test(o);
        const greenPass     = /GREEN_PASS/.test(o);
        const pass = chainDone && witnessRan;
        return {
          pass,
          score: pass ? 1 : 0,
          reason: `chainDone=${chainDone} implComplete=${implComplete} witnessRan=${witnessRan} [strict-bonus redFail=${redFail} greenPass=${greenPass}]`,
        };
